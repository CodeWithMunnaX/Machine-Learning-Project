grid_search:
  cv: 5
  verbose: 0

catboost:
  iterations: 350
  depth: 6
  learning_rate: 0.04
  l2_leaf_reg: 3
  random_seed: 42
  verbose: 0

xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.03
  subsample: 0.85
  colsample_bytree: 0.85
  random_state: 42
  eval_metric: logloss
  verbosity: 0

random_forest:
  n_estimators: 250
  max_depth: 16
  min_samples_split: 5
  min_samples_leaf: 2
  random_state: 42
  n_jobs: -1

meta_learner:
  C: 1.5
  max_iter: 1000
  random_state: 42

